name: Sync Vinted wardrobe (auto)

# Meme rythme que scan-market.yml (4h) : decision explicite du 2026-08-31,
# aucune raison de faire visiter automatiquement les vrais comptes Vinted
# de l'utilisateur plus souvent que ce qui tourne deja sans souci pour le
# scan marche.
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run sync:wardrobe
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
